name: Kokoro af_heart audio render

on:
  push:
    paths:
      - '.github/workflows/kokoro-audio-render.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kokoro-audio-render

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kokoro-onnx soundfile numpy
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Kokoro model assets
        working-directory: kokoro_audio
        run: |
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin

      - name: Render 66 flashcards with af_heart
        run: python kokoro_audio/render_kokoro.py

      - name: Upload audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: Data-Organization-Kernel-af-heart
          path: |
            kokoro_audio/Data_Organization_Kernel_af_heart.mp3
            kokoro_audio/Data_Organization_Kernel_af_heart.wav
          if-no-files-found: error
          retention-days: 7
